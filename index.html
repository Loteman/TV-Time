<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TV TIME - טלוויזיה לייב</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230f1218'/><line x1='8' y1='7' x2='5' y2='3' stroke='%23f0b90b' stroke-width='1.4' stroke-linecap='round'/><line x1='16' y1='7' x2='19' y2='3' stroke='%23f0b90b' stroke-width='1.4' stroke-linecap='round'/><rect x='3' y='7' width='18' height='11' rx='2' fill='none' stroke='%23f0b90b' stroke-width='1.6'/><line x1='9' y1='21' x2='15' y2='21' stroke='%23f0b90b' stroke-width='1.6' stroke-linecap='round'/><line x1='12' y1='18' x2='12' y2='21' stroke='%23f0b90b' stroke-width='1.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" id="brandHome" href="./" title="לדף הבית">
    <iconify-icon icon="mdi:television-classic"></iconify-icon>
    <div>
      <h1>TV <span>TIME</span></h1>
      <small>טלוויזיה ורדיו לייב</small>
    </div>
  </a>
  <div class="search-row">
    <div class="search-wrap">
      <input id="searchDesktop" type="text" placeholder="חיפוש ערוץ...">
      <iconify-icon icon="mdi:magnify"></iconify-icon>
    </div>
  </div>
  <div class="header-actions">
    <div class="icon-btn" id="allChannelsBtn" title="כל הערוצים">
      <iconify-icon id="allChannelsBtnIcon" icon="mdi:view-grid-outline"></iconify-icon>
    </div>
    <div class="icon-btn" id="settingsBtn" title="הגדרות">
      <iconify-icon icon="mdi:cog-outline"></iconify-icon>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-title">
        <iconify-icon icon="mdi:cog-outline"></iconify-icon>
        <span>הגדרות</span>
      </div>
      <div class="settings-section-label">מקרא סטטוס ערוצים</div>
      <div class="legend-col">
        <span><span class="status-dot ok"></span>עובד</span>
        <span><span class="status-dot timeout"></span>לא ברור</span>
        <span><span class="status-dot blocked"></span>חסום</span>
      </div>
      <div class="retest-btn" id="retestBtn">
        <iconify-icon icon="mdi:refresh"></iconify-icon>
        <span>בדוק סטטוס ערוצים מחדש</span>
      </div>
    </div>
  </div>
</header>

<div class="app" id="appMain">

  <div class="player-col">
    <div class="player-shell" id="playerShell">
      <video id="playerVideo" playsinline controls hidden></video>
      <div class="player-empty" id="playerEmpty">
        <iconify-icon icon="mdi:remote-tv"></iconify-icon>
        <div>בחרו ערוץ מהרשימה כדי להתחיל</div>
      </div>
      <div class="loading-overlay hide" id="loadingOverlay">
        <span id="loadingText">מיד מתחילים</span>
        <div class="loading-bar"></div>
      </div>
      <div class="zap-btn zap-prev" id="zapPrev" title="ערוץ קודם">
        <iconify-icon icon="mdi:chevron-right"></iconify-icon>
      </div>
      <div class="zap-btn zap-next" id="zapNext" title="ערוץ הבא">
        <iconify-icon icon="mdi:chevron-left"></iconify-icon>
      </div>
      <div class="player-toast" id="playerToast"></div>
    </div>

    <div class="now-playing" id="nowPlaying" style="display:none;">
      <div class="info">
        <div class="np-avatar" id="npAvatar">TV</div>
        <div class="np-text">
          <div class="title" id="npTitle">-</div>
          <div class="sub" id="npSub">-</div>
        </div>
      </div>
      <div class="np-actions">
        <div class="source-toggle" id="sourceToggle">
          <div class="source-opt" data-source="stream" title="נגן ישיר: הווידאו עצמו, עם שליטה מלאה בעוצמת הקול">
            <iconify-icon icon="mdi:play-circle-outline"></iconify-icon>
            <span>נגן ישיר</span>
          </div>
          <div class="source-opt" data-source="link" title="אתר המשדר: הדף המקורי של הערוץ בתוך המסך">
            <iconify-icon icon="mdi:web"></iconify-icon>
            <span>אתר המשדר</span>
          </div>
        </div>
        <div class="pill-btn fav" id="npFav">
          <iconify-icon icon="mdi:star-outline"></iconify-icon>
          <span>מועדף</span>
        </div>
        <a class="pill-btn" id="npOpenNew" href="#" target="_blank" rel="noopener">
          <iconify-icon icon="mdi:open-in-new"></iconify-icon>
          <span>פתח בטאב חדש</span>
        </a>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="tabs">
      <div class="tab active" data-mode="tv" id="tabTv">
        <iconify-icon icon="mdi:television-classic"></iconify-icon>
        <span>טלוויזיה</span>
      </div>
      <div class="tab" data-mode="radio" id="tabRadio">
        <iconify-icon icon="mdi:radio"></iconify-icon>
        <span>רדיו</span>
      </div>
    </div>
    <div class="search-wrap-mobile">
      <input id="searchMobile" type="text" placeholder="חיפוש ערוץ...">
      <div class="icon-btn" id="filterBtn" title="סינון ערוצים">
        <iconify-icon icon="mdi:filter-variant"></iconify-icon>
      </div>
      <div class="filter-panel" id="filterPanel">
        <div class="settings-title">
          <iconify-icon icon="mdi:filter-variant"></iconify-icon>
          <span>סינון ערוצים</span>
        </div>
        <div class="settings-section-label">סטטוס בדיקה</div>
        <div class="filter-chip-group">
          <label class="filter-chip status-chip-ok"><input type="checkbox" id="chkOk" checked><span>עובד</span></label>
          <label class="filter-chip status-chip-timeout"><input type="checkbox" id="chkTimeout"><span>לא ברור</span></label>
          <label class="filter-chip status-chip-blocked"><input type="checkbox" id="chkBlocked"><span>חסום</span></label>
        </div>
        <div class="settings-section-label">מקור ניגון</div>
        <div class="filter-chip-group">
          <label class="filter-chip" title="ערוצים עם שידור ישיר, שמתנגנים בנגן של האתר"><input type="checkbox" id="chkStream" checked><span>נגן ישיר</span></label>
          <label class="filter-chip" title="ערוצים בלי שידור ישיר, שמוצגים דרך אתר המשדר"><input type="checkbox" id="chkSite" checked><span>אתר המשדר</span></label>
        </div>
        <div class="retest-btn" id="filterResetBtn">
          <iconify-icon icon="mdi:backup-restore"></iconify-icon>
          <span>איפוס לברירת מחדל</span>
        </div>
      </div>
      <div class="icon-btn" id="favToggleMobile" title="הצג מועדפים בלבד">
        <iconify-icon icon="mdi:star"></iconify-icon>
      </div>
    </div>
    <div class="status-progress" id="statusProgress" hidden>
      <iconify-icon icon="mdi:loading"></iconify-icon>
      <span id="statusProgressText"></span>
    </div>
    <div class="channel-list" id="channelList"></div>
  </div>

  <div class="side-controls">
    <div class="vcontrol">
      <iconify-icon icon="mdi:brightness-6"></iconify-icon>
      <div class="vslider-wrap">
        <input type="range" id="brightnessSlider" min="40" max="150" value="100" title="בהירות התמונה">
      </div>
      <span class="control-value" id="brightnessValueLabel">100%</span>
    </div>
    <div class="vcontrol" id="volumeControl">
      <iconify-icon id="volumeIcon" icon="mdi:volume-high"></iconify-icon>
      <div class="vslider-wrap">
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
      <span class="control-value" id="volumeValueLabel">80%</span>
      <iconify-icon class="hint-icon" id="volumeHint" icon="mdi:information-outline" hidden></iconify-icon>
    </div>
  </div>

</div>

<div class="all-channels-overlay" id="allChannelsOverlay">
  <div class="ac-content" id="allChannelsContent"></div>
</div>

<script src="channels.js"></script>
<script src="script.js"></script>

</body>
</html>
